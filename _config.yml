# _config.yml

remote_theme: "jekyll/minima"

title: "@akrha's page"

author: "@akrha"

minima:
  skin: auto
  social_links:
    - { title: GitHub,     icon: github, url: "https://github.com/akrha" }
    - { title: Qiita,      icon: rss,    url: "https://qiita.com/akrha" }
    - { title: はてなブログ, icon: rss,    url: "https://akrha.hatenablog.com/" }
  hide_site_feed_link: true

exclude:
  - README.md
  - compose.yaml

# minima テーマ側の Sass 非推奨警告を抑制（テーマが Dart Sass 3 対応するまで）
sass:
  quiet_deps: true
  silence_deprecations: [import, global-builtin, color-functions]
